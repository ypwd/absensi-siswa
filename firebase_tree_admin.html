<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMKWD Firebase Tree Admin</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}
.card{max-width:1100px;margin:auto;background:#1e293b;padding:24px;border-radius:18px;box-shadow:0 12px 40px #0005}
input,textarea,button,select{font:inherit}input,textarea,select{width:100%;box-sizing:border-box;background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:10px;padding:11px;margin:6px 0 14px}
button{border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;margin:4px}
button.secondary{background:#475569}.danger{background:#b91c1c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
pre{background:#020617;padding:14px;border-radius:10px;overflow:auto;max-height:420px}
.small{color:#94a3b8;font-size:13px}
h1{margin-top:0}
</style>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
</head>
<body><div class="card">
<h1>SMKWD — Firebase Tree Admin</h1>
<p class="small">Alat ini langsung ke Firebase. Hanya gunakan dengan akun admin. File seed/password jangan ditempatkan di GitHub publik.</p>
<div class="grid">
<div>
<label>Username Admin</label><input id="user" value="admin">
<label>Password</label><input id="pass" type="password">
<button onclick="login()">Login Admin</button>
<button class="secondary" onclick="logout()">Logout</button>
<div id="status" class="small">Belum login.</div>
</div>
<div>
<label>Node yang boleh diedit</label>
<select id="node">
<option value="shared">shared</option>
<option value="shared/students">shared/students</option>
<option value="shared/teachers">shared/teachers</option>
<option value="shared/holidays">shared/holidays</option>
<option value="shared/config">shared/config</option>
<option value="apps/absensi_siswa">apps/absensi_siswa</option>
<option value="apps/absensi_guru">apps/absensi_guru</option>
<option value="apps/piket">apps/piket</option>
</select>
<button onclick="loadNode()">Baca Node</button>
</div>
</div>
<div class="grid">
<div><label>JSON Node</label><textarea id="json" rows="22" placeholder='{"contoh":"nilai"}'></textarea></div>
<div><label>Hasil</label><pre id="out">Siap.</pre></div>
</div>
<div>
<button onclick="saveNode()">Simpan Node</button>
<button class="secondary" onclick="downloadJson()">Download JSON</button>
<input id="file" type="file" accept=".json" onchange="importFile()">
</div>
</div>
<script>
const cfg=window.SMKWDFirebaseConfig.firebase; firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.database(),school=(window.SMKWDFirebaseConfig.schoolId||'SMKWD');
const root=p=>'schools/'+school+'/'+p.replace(/^\/+/,'');
const out=x=>document.getElementById('out').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
async function login(){
 try{
  const u=document.getElementById('user').value.trim(),p=document.getElementById('pass').value;
  let c; for(const type of ['admin']){try{c=await auth.signInWithEmailAndPassword(u.toLowerCase().replace(/\s+/g,'_')+'@'+type+'.smkwd.local',p);break}catch(e){}}
  if(!c)throw Error('Login admin gagal');
  const s=await db.ref(root('security/users/'+c.user.uid)).once('value'),profile=s.val();
  if(!profile||profile.role!=='admin'||profile.active!==true){await auth.signOut();throw Error('Akun bukan admin aktif.');}
  document.getElementById('status').textContent='Login sebagai '+(profile.nama||profile.identifier||'admin');
 }catch(e){out('ERROR: '+e.message)}
}
async function logout(){await auth.signOut();document.getElementById('status').textContent='Logout.'}
async function loadNode(){
 try{const s=await db.ref(root(document.getElementById('node').value)).once('value');document.getElementById('json').value=JSON.stringify(s.val()||{},null,2);out('Node berhasil dibaca.')}catch(e){out('ERROR: '+e.message)}
}
async function saveNode(){
 try{if(!auth.currentUser)throw Error('Login admin terlebih dahulu.');const value=JSON.parse(document.getElementById('json').value);await db.ref(root(document.getElementById('node').value)).set(value);out('Node berhasil disimpan ke Firebase.')}catch(e){out('ERROR: '+e.message)}
}
function downloadJson(){const b=new Blob([document.getElementById('json').value],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='firebase_node.json';a.click()}
function importFile(){const f=document.getElementById('file').files[0];if(!f)return;const r=new FileReader();r.onload=()=>document.getElementById('json').value=r.result;r.readAsText(f)}
</script></body></html>
